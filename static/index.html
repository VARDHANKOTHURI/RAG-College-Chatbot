<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusAI — RAG-Based College Information Assistant</title>
  <meta name="description" content="AI-powered RAG College Chatbot providing verified, grounded answers on admissions, examinations, fees, hostel, and academic regulations.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#EEF2FF',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <!-- Top Navigation Bar -->
  <header id="navbar" class="glass-panel sticky top-0 z-40 border-b border-gray-800/80 backdrop-blur-xl"></header>

  <!-- Main Application Mount -->
  <main id="app" class="flex-1 flex flex-col"></main>

  <!-- Modal Portal -->
  <div id="modalContainer"></div>

  <!-- Application Logic -->
  <script src="/static/app.js"></script>
</body>
</html>
